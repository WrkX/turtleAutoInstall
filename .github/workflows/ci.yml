name: TUI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Build Linux smoke binary
        run: go build -trimpath -o tortoise-smoke .

  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell tools
        shell: pwsh
        run: |
          $parseFailures = @()
          Get-ChildItem -LiteralPath tools -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $messages = ($parseErrors | ForEach-Object { $_.Message }) -join '; '
              $parseFailures += "$($_.Name): $messages"
            }
          }
          if ($parseFailures.Count -gt 0) {
            $parseFailures | Write-Error
            exit 1
          }

  windows-build:
    runs-on: ubuntu-latest
    needs: [test, powershell-syntax]
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - name: Build Windows amd64 TUI
        run: go build -trimpath -ldflags "-s -w" -o tortoise.exe .
        env:
          GOOS: windows
          GOARCH: amd64
      - uses: actions/upload-artifact@v4
        with:
          name: tortoise-windows-amd64
          path: tui/tortoise.exe
          if-no-files-found: error
          retention-days: 30
      - name: Package launcher bundle
        working-directory: .
        run: |
          rm -rf dist/tortoise-wow-tui-windows-amd64
          mkdir -p dist/tortoise-wow-tui-windows-amd64
          cp tui/tortoise.exe tui.bat README.md dist/tortoise-wow-tui-windows-amd64/
          (cd dist/tortoise-wow-tui-windows-amd64 && zip -q ../tortoise-wow-tui-windows-amd64.zip tortoise.exe tui.bat README.md)
      - uses: actions/upload-artifact@v4
        with:
          name: tortoise-wow-tui-windows-amd64
          path: dist/tortoise-wow-tui-windows-amd64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload tagged build to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" tui/tortoise.exe dist/tortoise-wow-tui-windows-amd64.zip --clobber
