name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Build Linux smoke binary
        run: go build -trimpath -o tortoise-smoke ./tui

  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell tools
        shell: pwsh
        run: |
          $parseFailures = @()
          Get-ChildItem -LiteralPath tools -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $messages = ($parseErrors | ForEach-Object { $_.Message }) -join '; '
              $parseFailures += "$($_.Name): $messages"
            }
          }
          if ($parseFailures.Count -gt 0) {
            $parseFailures | Write-Error
            exit 1
          }

  windows-exe:
    runs-on: ubuntu-latest
    needs: [test, powershell-syntax]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build Windows amd64 exe
        run: go build -trimpath -ldflags "-s -w" -o tortoise.exe ./tui
        env:
          GOOS: windows
          GOARCH: amd64
      - uses: actions/upload-artifact@v4
        with:
          name: tortoise.exe
          path: tortoise.exe
          if-no-files-found: error
          retention-days: 30
