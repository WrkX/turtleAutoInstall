name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Build tortoise.exe
        run: go build -trimpath -ldflags "-s -w" -o tortoise.exe ./tui
        env:
          GOOS: windows
          GOARCH: amd64
      - name: Checksum
        run: sha256sum tortoise.exe | tee tortoise.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tortoise.exe
          path: |
            tortoise.exe
            tortoise.exe.sha256
          if-no-files-found: error
      - name: Next release tag
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          existing="$(git tag --points-at "${GITHUB_SHA}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [ -n "$existing" ]; then
            next="$existing"
            echo "Reusing tag ${next} already on this commit"
          else
            latest="$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1 || true)"
            if [ -z "$latest" ]; then
              next="0.1.0"
            else
              major="${latest%%.*}"
              rest="${latest#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"
              next="${major}.${minor}.$((patch + 1))"
            fi
            echo "Next release tag: ${next} (previous: ${latest:-none})"
          fi
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" tortoise.exe tortoise.exe.sha256 --clobber
          else
            gh release create "$tag" \
              --target "${GITHUB_SHA}" \
              --generate-notes \
              tortoise.exe tortoise.exe.sha256
          fi
