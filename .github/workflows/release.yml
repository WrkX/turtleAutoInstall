name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Build tortoise.exe
        run: go build -trimpath -ldflags "-s -w" -o tortoise.exe ./tui
        env:
          GOOS: windows
          GOARCH: amd64
      - name: Checksum
        run: sha256sum tortoise.exe | tee tortoise.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tortoise.exe
          path: |
            tortoise.exe
            tortoise.exe.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" tortoise.exe tortoise.exe.sha256 --clobber
